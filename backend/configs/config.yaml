database:
  # MySQL 连接串，请改成你的实际地址；生产环境建议通过环境变量 AIOPS_DATABASE_DSN 注入
  dsn: "root:root@tcp(localhost:3306)/aiops?charset=utf8mb4&parseTime=True&loc=Local"
server:
  port: ":8080"
app:
  # 前端访问地址，用于巡检报告通知中的"完整报告"链接
  frontend_base_url: "http://localhost:5173"
knowledge:
  # Python 算法服务地址（知识库解析/向量化/检索）
  python_base_url: "http://localhost:9000"
  # 知识库上传文件的本地存储目录
  upload_dir: "./uploads/knowledge"
  # 知识库 Qdrant 向量库地址，也是 system_configs 表中 qdrant_url 的种子默认值
  qdrant_url: "http://localhost:6333"
log_analysis:
  # 日志分析周期任务间隔（如 5m / 30s / 1h）
  interval: "5m"