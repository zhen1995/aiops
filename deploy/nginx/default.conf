server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 知识库文档上传（docx/pdf 等）放宽到 50MB
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;   # hash 路由下其实不会命中回退，写上无害
    }

    # 后端 API，含 SSE（对话流式 /api/chat/sessions/:id/stream）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必需：关闭缓冲与缓存，否则对话流式输出会被截断/延迟
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 600s;            # 大模型响应慢，读超时放宽
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no;    # 兼容部分网关
    }
}
