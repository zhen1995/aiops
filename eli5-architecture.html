<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>这个系统是怎么工作的？</title>
<style>
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f4ff; margin: 0; padding: 40px 20px; text-align: center; }
  h1 { font-size: 42px; color: #1a2b5c; margin-bottom: 8px; }
  .sub { font-size: 22px; color: #5a6b9c; margin-bottom: 50px; }
  .row { display: flex; justify-content: center; align-items: stretch; gap: 24px; flex-wrap: wrap; margin-bottom: 50px; }
  .card { background: #fff; border-radius: 24px; padding: 30px 20px; width: 220px; box-shadow: 0 6px 20px rgba(26,43,92,.08); }
  .pic { font-size: 80px; line-height: 1.2; }
  .name { font-size: 24px; font-weight: bold; color: #1a2b5c; margin: 12px 0 6px; }
  .desc { font-size: 18px; color: #44507a; }
  .arrow { font-size: 40px; color: #8a97c4; align-self: center; }
  .flow { background: #1a2b5c; color: #fff; border-radius: 24px; padding: 36px 30px; max-width: 900px; margin: 0 auto; }
  .flow h2 { font-size: 30px; margin: 0 0 24px; }
  .step { display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 22px; margin: 14px 0; flex-wrap: wrap; }
  .step .pic { font-size: 44px; }
  .step .txt { text-align: left; }
  .step small { display: block; font-size: 16px; color: #aab8e8; }
</style>
</head>
<body>

<h1>🏥 这个系统是一家「医院」</h1>
<div class="sub">它照顾的不是病人，是电脑系统</div>

<div class="row">
  <div class="card">
    <div class="pic">🖼️</div>
    <div class="name">前端</div>
    <div class="desc">医院的<b>前台大厅</b><br>人在这里看信息、提问题</div>
  </div>
  <div class="card">
    <div class="pic">🧠</div>
    <div class="name">后端</div>
    <div class="desc">医院的<b>大脑</b><br>所有的决定都在这里做</div>
  </div>
  <div class="card">
    <div class="pic">📚</div>
    <div class="name">知识库</div>
    <div class="desc">医院的<b>图书室</b><br>存着所有说明书</div>
  </div>
  <div class="card">
    <div class="pic">🗄️</div>
    <div class="name">数据库</div>
    <div class="desc">医院的<b>档案柜</b><br>什么都记下来，不丢</div>
  </div>
</div>

<div class="flow">
  <h2>🔁 一天是怎么过的</h2>
  <div class="step"><span class="pic">🙋</span><span class="txt">你提问<small>「为什么网站变慢了？」</small></span></div>
  <div class="step"><span class="pic">⬇️</span></div>
  <div class="step"><span class="pic">🧠</span><span class="txt">大脑去问各个科室<small>查监控 📈 · 查日志 📄 · 翻图书室 📚</small></span></div>
  <div class="step"><span class="pic">⬇️</span></div>
  <div class="step"><span class="pic">🗣️</span><span class="txt">用大白话回答你</span></div>
  <div class="step"><span class="pic">➖</span></div>
  <div class="step"><span class="pic">🚨</span><span class="txt">没人的时候它也值班<small>盯着监控 · 出问题了发警报 · 自己分析原因 · 定时写报告</small></span></div>
</div>

<p style="margin-top:40px; font-size:20px; color:#5a6b9c;">
一句话：🙋 提问 → 🧠 大脑调度 → 📈📄📚 收集证据 → 🗣️ 给出答案
</p>

</body>
</html>
